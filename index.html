<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chantier Électrique</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Maquette 3D collée en haut, fiche du chantier et questions dessous. Couleurs des fils : marron, bleu, vert-jaune. */
:root{
  --bg:#EEEFEF;--card:#FFFFFF;--card2:#E7E8E8;--ink:#1F2A37;--mute:#5C6672;--line:#D2D5D8;
  --brand:#C4520C;--brown:#8A5A2B;--wire:#2F6FDE;--earthy:#F2C500;
  --good:#17824F;--goodbg:#DDF3E7;--bad:#C0332A;--badbg:#FBE3E0;--warn:#A86B00;--warnbg:#FFF1CC;
  --fd:'Barlow Condensed','Arial Narrow',sans-serif;--fb:'IBM Plex Sans',system-ui,sans-serif;--fm:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13161A;--card:#1B2026;--card2:#252B33;--ink:#EEF0F2;--mute:#A3ABB5;--line:#343B44;
  --brand:#F29A4A;--brown:#D09A60;--wire:#5B97FF;--earthy:#F5CE2B;
  --good:#4CC38A;--goodbg:#10382A;--bad:#FF8076;--badbg:#42191A;--warn:#F0B84A;--warnbg:#3C2E0B;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13161A;--card:#1B2026;--card2:#252B33;--ink:#EEF0F2;--mute:#A3ABB5;--line:#343B44;
  --brand:#F29A4A;--brown:#D09A60;--wire:#5B97FF;--earthy:#F5CE2B;
  --good:#4CC38A;--goodbg:#10382A;--bad:#FF8076;--badbg:#42191A;--warn:#F0B84A;--warnbg:#3C2E0B;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--fb);
  padding-block:10px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{font:700 30px/1 var(--fd);letter-spacing:.01em}
.pill{font:600 12px var(--fm);color:var(--brand);letter-spacing:.06em;text-transform:uppercase}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-direction:column;gap:6px;background:var(--bg);padding-bottom:6px}
.stage{position:relative;height:clamp(190px,33vh,300px);border:1px solid var(--line);border-radius:14px;background:var(--card2);overflow:hidden;touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.tag3d{position:absolute;left:10px;bottom:8px;right:10px;font:600 12px var(--fm);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 8px;pointer-events:none;width:fit-content;max-width:calc(100% - 20px)}
.hint3d{position:absolute;right:8px;top:8px;font:500 11px var(--fm);color:var(--mute);pointer-events:none}
.no3d{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;color:var(--mute);font-size:14px}
.phases{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.phases i{font:600 10px var(--fm);text-align:center;padding:5px 2px;border-radius:6px;background:var(--card2);color:var(--mute);font-style:normal;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phases i.on{background:var(--brand);color:var(--card)}
.phases i.ok{background:var(--goodbg);color:var(--good)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.fiche{display:flex;flex-direction:column;gap:10px}
.fiche h2{font:700 28px/1.05 var(--fd);text-transform:capitalize}
.fiche h2.q{font:600 19px/1.3 var(--fb);text-transform:none}
#nx:empty{display:none}
.pill{text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font:500 13px var(--fm);background:var(--card2);border-radius:6px;padding:4px 8px}
.fiche ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:14px}
.fiche li{display:contents}
.fiche li b{font:500 13px var(--fm);text-align:right}
.lead{color:var(--mute);font-size:14px}
.btn{appearance:none;border:0;border-radius:10px;background:var(--brand);color:var(--card);font:600 16px var(--fb);padding:14px 18px;cursor:pointer;width:100%}
.btn.alt{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn:active,.opt:not(:disabled):active{transform:translateY(1px)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.qh{display:flex;justify-content:space-between;font:600 12px var(--fm);color:var(--mute);letter-spacing:.05em;text-transform:uppercase}
.q{font:600 19px/1.3 var(--fb);text-wrap:pretty}
.ctx{background:var(--card2);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.5}
.ctx b{font-family:var(--fm);font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px;font:500 16px/1.35 var(--fb);display:flex;flex-direction:column;gap:6px;cursor:pointer;width:100%}
.opt .row{display:flex;gap:10px;align-items:flex-start}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font:600 13px var(--fm);color:var(--mute)}
.opt .why{display:none;font:400 14px/1.5 var(--fb);color:var(--ink);padding-left:34px}
.opt .why b{font:700 13px var(--fm);letter-spacing:.04em;text-transform:uppercase;display:block;margin-bottom:1px}
.opt:disabled{cursor:default}
.opt.shown .why{display:block}
.opt.good{border-color:var(--good);background:var(--goodbg)}
.opt.good .why b{color:var(--good)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .why b{color:var(--bad)}
.opt.other .why b{color:var(--mute)}
.res{text-align:center;align-items:center}
.res .score{font:700 84px/1 var(--fd)}
.rec{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:10px;text-align:left;font-size:14px}
.rec li{border-left:4px solid var(--bad);padding:2px 0 2px 10px}
.rec li b{display:block}
.rec li span{color:var(--mute)}
.mode{position:absolute;left:8px;top:8px;appearance:none;font:600 12px var(--fb);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.more{background:var(--card2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.5}
.more h3{font:700 17px var(--fd);letter-spacing:.04em;text-transform:uppercase;margin:0 0 2px}
.more dl{margin:0;display:flex;flex-direction:column;gap:10px}
.more dt{font-weight:600}
.more dd{margin:0}
.more .gap{border-top:1px solid var(--line);padding-top:10px}
.lnk{appearance:none;background:none;border:0;color:var(--brand);font:600 15px var(--fb);padding:6px 0;text-align:left;cursor:pointer;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
body{margin:0}[hidden]{display:none!important}
</style>
</head>
<body>

<main class="wrap">
 <div class="top"><h1>Chantier Électrique</h1><span class="pill" id="pill"></span></div>
 <div class="sticky">
  <div class="stage" id="stage"><canvas id="cv"></canvas><div class="hint3d" id="hint">glisse pour tourner</div><button class="mode" id="mode" type="button">Voir l’intérieur</button><div class="tag3d" id="tag" hidden></div></div>
  <div class="phases" id="phases"></div>
 </div>
 <div id="app"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pickR=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fx=n=>String(Math.round(n*10)/10).replace('.',',');
const kw=w=>fx(w/1000)+' kW';
const APP={plaque:['Plaque de cuisson',5500],four:['Four',2500],lavevaisselle:['Lave-vaisselle',2000],lavelinge:['Lave-linge',2200],sechelinge:['Sèche-linge',2500],chauffeeau:['Chauffe-eau',2500],rad:['Radiateur électrique',1000],ve:['Borne de recharge voiture',7000],portail:['Portail motorisé',500],cuisinepro:['Cuisine professionnelle',12000],ascenseur:['Ascenseur',5000]};
const RT={entree:['Entrée',0xd9d2c5],sejour:['Séjour',0xc9a27a],cuisine:['Cuisine',0xd6d1c6],chambre:['Chambre',0xbfa58a],sdb:['Salle de bain',0xc9d3d0],buanderie:['Buanderie',0xd2ccc0],garage:['Garage',0x8f949a],hall:['Hall',0xcbb89a],technique:['Local technique',0x9aa0a6]};
const STD=[3,6,9,12,15,18,24,30,36];
const SP={C16:'16 A en 1,5 mm²',C20:'20 A en 2,5 mm²',C32:'32 A en 6 mm²'};
/* Tire un bâtiment au hasard : pièces, étages, chauffage */
function gen(){
 const type=pickR(['appartement','maison','villa','hôtel']),rooms=[];
 const add=(k,fl,w,d,n)=>{const r={id:rooms.length,k,fl,w,d,m2:Math.round(w*d),n:n||RT[k][0]};rooms.push(r);return r};
 let etages=1,elec=Math.random()<.5;
 if(type==='appartement'){add('entree',0,2,2);add('sejour',0,rnd(4,6),rnd(4,5));add('cuisine',0,rnd(3,4),3);const nb=rnd(1,3);for(let i=1;i<=nb;i++)add('chambre',0,3.5,rnd(3,4),'Chambre '+i);add('sdb',0,2.5,rnd(2,3))}
 else if(type==='maison'){add('entree',0,2,2);add('sejour',0,rnd(5,6),rnd(4,5));add('cuisine',0,rnd(3,4),rnd(3,4));add('buanderie',0,2.5,2.5);const nb=rnd(2,4);for(let i=1;i<=nb;i++)add('chambre',0,3.5,rnd(3,4),'Chambre '+i);add('sdb',0,3,rnd(2,3))}
 else if(type==='villa'){etages=2;add('entree',0,2.5,2.5);add('sejour',0,rnd(6,7),rnd(5,6));add('cuisine',0,4,rnd(3,4));add('buanderie',0,3,2.5);add('garage',0,3.5,6);const nb=rnd(3,4);for(let i=1;i<=nb;i++)add('chambre',1,3.5,4,'Chambre '+i);add('sdb',1,3,2.5,'Salle de bain 1');add('sdb',1,3,2.5,'Salle de bain 2')}
 else{etages=rnd(2,3);elec=true;add('hall',0,4,4,'Hall d’accueil');add('cuisine',0,4,4,'Cuisine du restaurant');add('technique',0,3,3);for(let f=1;f<=etages;f++){const nb=rnd(3,4);for(let i=1;i<=nb;i++)add('chambre',f,3.5,4,'Chambre '+f+'0'+i)}}
 const by={};rooms.forEach(r=>(by[r.fl]=by[r.fl]||[]).push(r));
 for(const f in by){let x=0,z=0,rh=0;for(const r of by[f]){if(x>0&&x+r.w>13){x=0;z+=rh+.15;rh=0}r.x=x+r.w/2;r.z=z+r.d/2;x+=r.w+.15;rh=Math.max(rh,r.d)}}
 let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;rooms.forEach(r=>{x0=Math.min(x0,r.x-r.w/2);x1=Math.max(x1,r.x+r.w/2);z0=Math.min(z0,r.z-r.d/2);z1=Math.max(z1,r.z+r.d/2)});
 const cx=(x0+x1)/2,cz=(z0+z1)/2;rooms.forEach(r=>{r.x-=cx;r.z-=cz;r.y=r.fl*3});
 const sc={type,rooms,etages,elec,b:{x0:x0-cx,x1:x1-cx,z0:z0-cz,z1:z1-cz},m2:rooms.filter(r=>r.k!=='garage').reduce((s,r)=>s+r.m2,0)};
 equip(sc);return sc}
/* Liste des circuits à installer + gros appareils (sert au calcul de puissance) */
function equip(sc){
 const R=sc.rooms,f1=k=>R.find(r=>r.k===k),all=k=>R.filter(r=>r.k===k),cs=[],gros=[];
 const add=(kind,room,o={})=>cs.push({kind,room:room.id,...o});
 const g=(k,n=1)=>gros.push({k,n,w:APP[k][1],t:APP[k][0]});
 if(sc.type==='hôtel'){
  const hall=f1('hall'),cu=f1('cuisine'),tech=f1('technique');
  add('cuisinepro',cu);g('cuisinepro');g('ascenseur');
  add('baes',hall);add('lumiere',hall,{pts:6});
  for(let f=1;f<=sc.etages;f++){const ch=R.filter(r=>r.k==='chambre'&&r.fl===f);add('lumiere',ch[0],{pts:ch.length+1,label:'l’étage '+f});add('prises',ch[0],{n:3*ch.length,label:'l’étage '+f});ch.forEach(c=>add('rad',c));g('rad',ch.length)}
 }else{
  const cu=f1('cuisine'),bu=f1('buanderie'),sj=f1('sejour'),sd=f1('sdb'),ch=all('chambre');
  add('plaque',cu);g('plaque');add('four',cu);g('four');add('lavevaisselle',cu);g('lavevaisselle');
  if(bu){add('lavelinge',bu);g('lavelinge');if(Math.random()<.6){add('sechelinge',bu);g('sechelinge')}add('chauffeeau',bu);g('chauffeeau')}
  else{add('lavelinge',cu);g('lavelinge');add('chauffeeau',sd);g('chauffeeau')}
  if(sc.type==='villa'){const ga=f1('garage');add('ve',ga);g('ve');add('portail',ga);g('portail')}
  add('lumiere',sj,{pts:R.length+rnd(2,6),label:'toute la maison'});
  add('prises',cu,{n:6,label:'la cuisine'});
  add('prises',sj,{n:Math.max(5,Math.ceil(sj.m2/4)),label:'le séjour'});
  for(let i=0;i<ch.length;i+=2){const gr=ch.slice(i,i+2);add('prises',gr[0],{n:3*gr.length,label:gr.length>1?'les chambres '+gr.map(x=>x.n.replace('Chambre ','')).join(' et '):'la '+gr[0].n.toLowerCase()})}
  if(Math.random()<.7)add('volet',sj);
  if(sc.elec){[sj,...ch].forEach(r=>add('rad',r));g('rad',ch.length+1)}
 }
 sc.circ=cs;sc.gros=gros}
function power(sc){
 const sum=sc.gros.reduce((s,x)=>s+x.w*x.n,0),base=sc.type==='hôtel'?6000:3000,need=base+.4*sum;
 const k=STD.find(v=>v*1000>=need)||36,tri=k>12;
 return{sum,base,need,k,tri,I:Math.ceil(k*1000/(tri?690:230))}}
/* Construit les questions du chantier. Dans chaque question, la 1re réponse est la bonne (mélangée ensuite). */
const PH=['Source','Tableau','Circuits','Terre','Contrôle'];
const plural=(n,s)=>n+' '+s+(n>1?'s':'');
function build(sc){
 const P=power(sc),hot=sc.type==='hôtel',qs=[];
 const nm={appartement:'cet appartement',maison:'cette maison',villa:'cette villa','hôtel':'cet hôtel'}[sc.type];
 const RM=id=>sc.rooms[id];
 /* 1. Source : puissance et intensité */
 const idx=STD.indexOf(P.k),lab=v=>v+' kVA '+(v>12?'triphasé':'monophasé');
 const cand=[idx-1,idx+1,idx-2,idx+2].filter(i=>i>=0&&i<STD.length).slice(0,2);
 const list=sc.gros.map(g=>g.t+(g.n>1?' ×'+g.n:'')+' '+kw(g.w*g.n)).join(' · ');
 qs.push({id:'source',ph:0,foc:'src',fx:{t:'src'},q:'Quelle puissance faut-il souscrire pour '+nm+' ?',
  ctx:'<b>Gros appareils :</b> '+list+'.<br><b>Méthode du jeu :</b> puissance à prévoir = '+kw(P.base)+' + 40 % de la somme des gros appareils (ils ne tournent jamais tous ensemble). Au-dessus de 12 kVA, on prend du triphasé.',
  o:[[lab(P.k),'Calcul : '+kw(P.base)+' + 40 % de '+kw(P.sum)+' = '+kw(P.need)+'. La première puissance proposée au-dessus est '+P.k+' kVA.'+(P.tri?' Et au-dessus de 12 kVA on passe en triphasé : en monophasé le courant dépasserait 52 A, trop gros sur une seule phase.':' Jusqu’à 12 kVA, le monophasé suffit.')]]
   .concat(cand.map(i=>{const v=STD[i];return[lab(v),v<P.k?v+' kVA, c’est trop juste : il te faut au moins '+kw(P.need)+'. Le compteur couperait dès que tu allumes plusieurs gros appareils.':v+' kVA, c’est trop : tu paierais un abonnement plus cher pour une puissance que tu n’utiliseras jamais.']}))});
 const wa=P.tri?Math.ceil(P.k*1000/230):Math.ceil(P.k*1000/690);let wb=Math.max(1,Math.round(P.I/2));if(wb===wa||wb===P.I)wb=P.I+7;
 qs.push({id:'int',ph:0,foc:'src',fx:{t:'int'},q:'Avec '+lab(P.k)+', quelle est l’intensité maximale ?',
  ctx:'Formule : intensité = puissance ÷ tension. En monophasé, 230 V. En triphasé, on répartit sur 3 phases.',
  o:[[P.I+' A'+(P.tri?' par phase':''),P.tri?P.k*1000+' ÷ (3 × 230) ≈ '+P.I+' A sur chaque phase.':P.k*1000+' ÷ 230 ≈ '+P.I+' A.'],
   [wa+' A'+(P.tri?' par phase':''),P.tri?'Tu as tout mis sur une seule phase (÷ 230). Le triphasé la répartit sur 3, donc ÷ (3 × 230).':'Tu as divisé par 3 comme en triphasé. Ici il n’y a qu’une phase : on divise par 230.'],
   [wb+' A'+(P.tri?' par phase':''),'Trop petit. Refais la division : puissance en watts ÷ tension.']]});
 /* 2. Tableau */
 if(hot){const E=sc.etages,nc=sc.rooms.filter(r=>r.k==='chambre').length;
  qs.push({id:'tabn',ph:1,foc:'tab',fx:{t:'tab'},q:'Combien de tableaux électriques pour '+nm+' ?',ctx:sc.etages+' étages de chambres, un rez-de-chaussée avec hall, cuisine et local technique.',
   o:[[(E+1)+' tableaux : 1 général + 1 par étage','Un tableau par étage : si un étage a un défaut, les autres continuent, et on coupe un étage sans toucher au reste.'],
    ['1 seul tableau pour tout l’hôtel','Une panne couperait tout l’hôtel, et il faudrait des câbles énormes jusqu’à chaque chambre.'],
    [nc+' tableaux, un par chambre','Beaucoup trop : on regroupe les chambres par étage.']]})}
 else{
  qs.push({id:'tabw',ph:1,foc:'tab',fx:{t:'tab'},q:'Où installer le tableau électrique de '+nm+' ?',
   o:[['Dans la GTL (gaine technique du logement), à l’entrée','La GTL est le placard technique du logement : facile d’accès pour couper vite en cas de problème, au sec et à l’abri.'],
    ['Dans la salle de bain','L’eau et l’humidité sont dangereuses : un tableau ne va jamais dans une salle d’eau.'],
    ['Dans les combles, sous le toit','Difficile d’accès : en cas d’urgence, on doit pouvoir tout couper tout de suite.']]});
  const n=sc.m2>35?3:2;
  qs.push({id:'nid',ph:1,foc:'tab',fx:{t:'tab'},q:'Combien de différentiels 30 mA au minimum ?',ctx:'Surface du logement : <b>'+sc.m2+' m²</b>.',
   o:[[String(n),sc.m2+' m² : '+(sc.m2>35?'plus de 35 m², donc au moins 3 différentiels':'35 m² ou moins, donc au moins 2 différentiels')+'. Chacun protège un groupe de circuits : un défaut ne coupe pas toute la maison.'],
    [String(n-1),'Pas assez pour '+sc.m2+' m². Avec trop peu de différentiels, un seul défaut coupe presque tout.'],
    [String(n+2),'Ça marcherait, mais c’est plus gros et plus cher que nécessaire. On prend le minimum de la règle.']]});
  const N=sc.circ.length,mod=N+2*n,need=Math.ceil(mod*1.2),r=Math.ceil(need/13);
  const rw=r===1?[2,3]:[r+1,r-1];
  qs.push({id:'size',ph:1,foc:'tab',fx:{t:'tab'},q:'De combien de rangées doit être le tableau ?',ctx:'<b>'+N+' circuits</b> à protéger. Un disjoncteur = 1 module, un différentiel = 2 modules, une rangée = 13 modules, et on garde <b>20 %</b> de place libre.',
   o:[[plural(r,'rangée'),N+' disjoncteurs + '+n+' différentiels × 2 = '+mod+' modules. Avec 20 % de réserve : '+need+' modules, soit '+r+' rangée'+(r>1?'s':'')+' de 13.'],
    [plural(rw[0],'rangée'),rw[0]>r?'Plus grand que nécessaire : place et argent perdus. 20 % de réserve suffit.':'Pas assez : '+rw[0]+' rangée'+(rw[0]>1?'s':'')+' = '+13*rw[0]+' modules, il en faut '+need+'.'],
    [plural(rw[1],'rangée'),rw[1]>r?'Plus grand que nécessaire : place et argent perdus.':'Pas assez : '+rw[1]+' rangée'+(rw[1]>1?'s':'')+' = '+13*rw[1]+' modules, il en faut '+need+'.']]});
  const cu=sc.rooms.find(r=>r.k==='cuisine');
  qs.push({id:'diff',ph:1,foc:cu.id,fx:{t:'tab'},q:'Quel type de différentiel pour la plaque de cuisson et le lave-linge ?',

/* Mots à connaître : repérés automatiquement dans la question, puis expliqués simplement */
const GLOS=[
 [/gtl|gaine technique/i,'GTL (gaine technique du logement)','Le grand placard technique à l’entrée du logement. On y trouve au même endroit le tableau électrique, le disjoncteur de branchement et le coffret de communication (Internet, TV, téléphone). Comme ça, tout est facile à trouver et à couper en cas de problème.'],
 [/tableau/i,'Tableau électrique','La boîte, souvent blanche, qui reçoit le courant du compteur et le distribue dans la maison par « circuits ». Chaque circuit (prises, lumières, plaque…) a son disjoncteur. Si tu l’ouvres, tu vois des rangées de petits interrupteurs.'],
 [/disjoncteur/i,'Disjoncteur','Un interrupteur de sécurité qui coupe tout seul s’il passe trop de courant dans un fil (surcharge) ou en cas de court-circuit. Il protège les FILS, pas les personnes. Son calibre, en ampères, dit à partir de quel courant il coupe.'],
 [/différentiel|30 ?ma/i,'Différentiel 30 mA','Il compare le courant qui part et celui qui revient. S’il en manque un petit peu (30 milliampères), ça fuit quelque part, peut-être à travers une personne : il coupe en une fraction de seconde. Il protège les PERSONNES. Le bouton « T » sert à le tester.'],
 [/type a\b|type ac\b/i,'Type A et type AC','Deux sortes de différentiels. Le type AC détecte les fuites simples. Le type A détecte en plus celles de certains appareils modernes (plaque, lave-linge) qui « déforment » le courant. Ces appareils doivent donc être protégés par un type A.'],
 [/calibre|ampère|\d ?a\b/i,'Ampère (A) et calibre','L’ampère mesure la quantité de courant qui passe dans un fil, un peu comme le débit d’un tuyau. Le calibre d’un disjoncteur (16 A, 20 A, 32 A…) est le courant maximum qu’il laisse passer avant de couper.'],
 [/mm²|section/i,'Section d’un fil (mm²)','C’est la grosseur du fil. Plus il est gros, plus il laisse passer de courant sans chauffer : 1,5 mm² pour les lumières, 2,5 mm² pour les appareils gourmands, 6 mm² pour la plaque. Un fil trop fin pour le courant chauffe : risque d’incendie.'],
 [/kva|kw\b|watt|puissance/i,'Puissance (W, kW, kVA)','Le watt (W) mesure ce qu’un appareil consomme. 1 kW = 1 000 W. Le kVA, pour une maison, c’est presque la même chose. Plus un appareil chauffe, plus il consomme : plaque, four, radiateur, chauffe-eau.'],
 [/monophasé|triphasé|phase|neutre/i,'Phase, neutre, monophasé, triphasé','Le courant arrive par des fils : la phase (qui « envoie ») et le neutre (qui « revient »). Monophasé = 1 phase + 1 neutre, comme dans la plupart des maisons (230 V). Triphasé = 3 phases + 1 neutre (400 V entre deux phases), pour les gros besoins : hôtel, gros moteurs, très grosses maisons.'],
 [/enedis|compteur|linky/i,'Enedis et compteur Linky','Enedis gère les fils et les compteurs du réseau électrique en France. Le compteur Linky mesure ta consommation. Ton fournisseur (EDF, TotalEnergies…) t’envoie la facture, mais c’est Enedis qui s’occupe du compteur et du raccordement.'],
 [/souscri|abonnement/i,'Puissance souscrite','C’est la puissance maximale que tu choisis dans ton abonnement (3, 6, 9, 12 kVA…). Si tu allumes trop d’appareils ensemble et que tu dépasses, le compteur coupe. Plus elle est grande, plus l’abonnement coûte cher.'],
 [/spécialisé/i,'Circuit spécialisé','Un circuit qui alimente un seul gros appareil (four, lave-linge, plaque…), avec son propre disjoncteur. Il ne fait pas disjoncter les prises, et son fil est assez gros pour lui.'],
 [/contacteur|heures creuses/i,'Contacteur jour/nuit et heures creuses','Les heures creuses sont des heures (souvent la nuit) où l’électricité coûte moins cher. Le contacteur jour/nuit est un petit relais dans le tableau qui allume le chauffe-eau à ces heures-là, pour faire des économies.'],
 [/consuel|attestation/i,'Consuel','Un organisme qui contrôle qu’une installation neuve est conforme et sûre. Après les travaux, il donne une attestation. Sans elle, Enedis ne met pas le courant dans un logement neuf.'],
 [/prise de terre|boucle|vert-jaune|la terre/i,'Prise de terre','Un fil (vert et jaune) relié à un conducteur enterré dans le sol. Si un appareil a une fuite, le courant file vers la terre au lieu de passer par toi. La « boucle à fond de fouille » est un câble de cuivre posé sous les fondations d’une maison neuve.'],
 [/équipotentiel/i,'Liaison équipotentielle','Un fil qui relie toutes les pièces métalliques (tuyaux d’eau, gaz, baignoire…) à la terre. Elles sont alors toutes au même niveau électrique : tu ne peux pas prendre un choc en touchant deux objets en même temps.'],
 [/volume/i,'Volumes de la salle de bain','La règle découpe la salle de bain en zones selon la distance à l’eau. Volume 0 : dans la baignoire ou la douche. Volume 1 : juste au-dessus, jusqu’à 2,25 m. Volume 2 : 60 cm autour. Plus on est près de l’eau, plus les appareils électriques sont limités.'],
 [/baes|éclairage de sécurité|blocs de secours/i,'Éclairage de sécurité (BAES)','Les petits blocs lumineux des couloirs. Ils ont une batterie et s’allument quand le courant est coupé, pour qu’on voie la sortie en cas d’incendie. Obligatoires dans les hôtels.'],
 [/module|rangée/i,'Modules et rangées','Dans le tableau, les appareils s’accrochent sur des rails. Un disjoncteur occupe 1 « module » (environ 1,8 cm), un différentiel 2. Une rangée contient 13 modules. On garde 20 % de place libre pour ajouter des circuits plus tard.'],
 [/surcharge|court-circuit/i,'Surcharge et court-circuit','Surcharge : trop d’appareils sur un même fil, il chauffe. Court-circuit : deux fils se touchent, énormément de courant d’un coup. Dans les deux cas, le disjoncteur doit couper.'],
 [/organisme agréé|public/i,'Lieu public (ERP)','Un hôtel reçoit du public : on parle d’ERP (établissement recevant du public). Les règles de sécurité sont plus strictes, et l’installation est contrôlée par un organisme agréé avant l’ouverture.'],
 [/\bvolts?\b|230 v|400 v|tension/i,'Tension (volt)','La tension, en volts (V), c’est un peu la « pression » du courant. Dans une prise de maison : 230 V. En triphasé : 400 V entre deux phases.']];
const GROS='Pourquoi un fil plus gros pour un appareil gourmand ? Plus le courant est fort, plus le fil chauffe, et un fil plus gros chauffe moins. Règle d’or : le disjoncteur doit toujours protéger le fil le plus fin du circuit. Un disjoncteur trop gros sur un fil trop fin ne coupe pas à temps.';

 source:'Quand on dimensionne, on additionne les appareils les plus gourmands, mais on ne prend pas 100 % : il est très rare que tout tourne en même temps. Ce principe s’appelle le foisonnement (ici, on prend 40 %). Trop petit, le compteur coupe souvent. Trop grand, l’abonnement coûte cher pour rien.',
 int:'L’intensité sert à dimensionner tout le reste : disjoncteur de branchement, câbles, protections. La formule de base : intensité = puissance ÷ tension. En triphasé, la puissance se partage sur 3 phases, donc chaque fil porte 3 fois moins de courant.',
 tabw:'La GTL est prévue pour les logements neufs : elle regroupe l’arrivée, le tableau et le coffret de communication. On la place dans le logement, à un endroit accessible et sec, jamais dans une pièce humide ni dans un endroit difficile à atteindre.',

 diff:'Les appareils à électronique (plaque à induction, lave-linge) peuvent laisser passer un courant de fuite « continu » qu’un type AC ne voit pas. Le type A le voit : c’est obligatoire pour ces circuits.',

 gros:GROS,

 ve:'Une borne de recharge tient la puissance pendant des heures, ce qui chauffe les fils beaucoup plus qu’une prise normale. C’est pour ça qu’elle a son propre circuit, bien dimensionné.',

 lumiere:'Un point lumineux, c’est un endroit qui s’allume (une lampe au plafond, une applique…). La règle : 8 points au maximum sur un circuit 16 A en 1,5 mm². Au-delà, on fait un deuxième circuit.',

 if(after&&MORE[q.id])h+='<div><h3>Pour aller plus loin</h3>'+MORE[q.id]+'</div>';
 if(hit.length)h+='<div'+(h?' class="gap"':'')+'><h3>Mots à connaître</h3><dl>'+hit.map(g=>'<dt>'+g[1]+'</dt><dd>'+g[2]+'</dd>').join('')+'</dl></div>';
 return h||'Pas de mot compliqué ici.'}
function newSite(){SC=gen();QS=null;safe(()=>{S3.load(SC);S3.setMode('ext')});intro()}
function intro(){
 pill.textContent=SC.type+(SC.etages>1?' · '+SC.etages+' étages':'');phEl.innerHTML=phases(null);
 const chips=[SC.m2+' m²',SC.rooms.length+' pièces',SC.etages+' étage'+(SC.etages>1?'s':''),SC.elec?'chauffage électrique':'chauffage au gaz'];
 app.innerHTML='<section class="card fiche"><div class="qh"><span>Chantier tiré au hasard</span></div><h2>'+SC.type+'</h2><div class="chips">'+chips.map(c=>'<span>'+c+'</span>').join('')+'</div>'
  +'<p class="lead">À toi de faire toute l’installation : la source, le tableau, les circuits, la terre, jusqu’aux récepteurs. Après chaque choix, le jeu explique pourquoi celui-là, et pourquoi pas les autres. Tu peux aussi ouvrir « Voir plus d’infos » pour comprendre les mots techniques.</p>'
  +'<p class="qh"><span>Gros appareils à alimenter</span></p><ul>'+SC.gros.map(g=>'<li><span>'+g.t+(g.n>1?' ×'+g.n:'')+'</span><b>'+kw(g.w*g.n)+'</b></li>').join('')+'</ul>'
  +'<button class="btn" id="go">Commencer le chantier</button><button class="btn alt" id="other">Tirer un autre bâtiment</button></section>'}
function start(){QS=build(SC).map(q=>({...q,o:shuf(q.o.map((o,k)=>({t:o[0],e:o[1],ok:k===0})))}));qi=0;score=0;res=[];ask()}
function ask(){const q=QS[qi];ans=false;safe(()=>{S3.setMode('int');S3.focus(q.foc)});phEl.innerHTML=phases(q.ph);
 app.innerHTML='<section class="card fiche"><div class="qh"><span>'+PH[q.ph]+'</span><span>Question '+(qi+1)+'/'+QS.length+'</span></div><h2 class="q">'+q.q+'</h2>'
  +(q.ctx?'<div class="ctx">'+q.ctx+'</div>':'')
  +'<div class="opts">'+q.o.map((o,k)=>'<button class="opt" data-k="'+k+'"><span class="row"><span class="k">'+'ABC'[k]+'</span><span>'+o.t+'</span></span><span class="why"></span></button>').join('')+'</div>'
  +'<div id="nx" class="fiche"><button class="lnk" data-i="1">Mots à connaître</button><div class="more" id="more" hidden></div></div></section>';
 window.scrollTo(0,0)}
function pick(k){if(ans)return;ans=true;const q=QS[qi],good=q.o[k].ok,last=qi===QS.length-1;res.push({good,q});if(good)score++;
 app.querySelectorAll('.opt').forEach((b,j)=>{const o=q.o[j];b.disabled=true;b.classList.add('shown',o.ok?'good':j===k?'bad':'other');
  b.querySelector('.why').innerHTML='<b>'+(o.ok?'Pourquoi celui-là':j===k?'Pourquoi pas ta réponse':'Pourquoi pas')+'</b>'+o.e});
 safe(()=>S3.apply(q.fx,good));
 const nx=document.getElementById('nx');
 nx.innerHTML=(q.p?'<div class="ctx"><b>'+(good?'Piège évité.':'C’était un piège.')+'</b></div>':'')+'<button class="btn alt" data-i="1">Voir plus d’infos</button><div class="more" id="more" hidden></div><button class="btn" id="next">'+(last?'Voir le résultat':'Continuer')+'</button>';
 nx.querySelector('.btn.alt').scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}
function toggleInfo(b){const m=document.getElementById('more');if(!m)return;const open=m.hidden;m.hidden=!open;if(open)m.innerHTML=infoHtml(QS[qi],ans);
 b.textContent=ans?(open?'Masquer les infos':'Voir plus d’infos'):(open?'Masquer les mots':'Mots à connaître')}
function next(){safe(()=>S3.fixRed());qi++;if(qi<QS.length)ask();else end()}
function end(){safe(()=>{S3.setMode('ext');S3.focus('all')});phEl.innerHTML=phases('all');const n=QS.length,bad=res.filter(r=>!r.good);
 const msg=score===n?'Sans faute : l’installation est parfaite.':score>=n*.75?'Très bon chantier. Relis les erreurs ci-dessous.':score>=n*.5?'Chantier correct, mais certaines erreurs seraient dangereuses. Relis les explications.':'Il y a encore du travail. Relis bien les explications, puis retente un autre bâtiment.';
 app.innerHTML='<section class="card fiche res"><div class="qh"><span>Rapport de chantier</span></div><div class="score">'+score+'/'+n+'</div><p class="lead">'+msg+'</p>'
  +(bad.length?'<p class="qh"><span>À retenir</span></p><ul class="rec">'+bad.map(r=>{const c=r.q.o.find(o=>o.ok);return'<li><b>'+r.q.q+'</b><span>Bonne réponse : '+c.t+'. '+c.e+'</span></li>'}).join('')+'</ul>':'')
  +'<button class="btn" id="other">Nouveau chantier au hasard</button></section>';window.scrollTo(0,0)}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.classList.contains('opt'))pick(+b.dataset.k);else if(b.dataset.i)toggleInfo(b);else if(b.id==='go'&&!QS)start();else if(b.id==='next')next();else if(b.id==='other')newSite()});
safe(()=>S3.init());newSite();
</script>
